<ion-modal (willDismiss)="onWillDismiss($event)" [isOpen]="isModalOpen">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Annuler</ion-button>
        </ion-buttons>
        <ion-title>Nouvelle tâche</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="submitForm()" [strong]="true">Valider</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <form [formGroup]="taskForm">
        <ion-item lines="none">
          <ion-input
            label="Intitulé de la tâche"
            labelPlacement="stacked"
            type="text"
            placeholder="Ex: Lancer la machine"
            formControlName="title"
          ></ion-input>
        </ion-item>

        <ion-item lines="none" class="ion-margin-top">
          <ion-input
            label="Note supplémentaire (facultatif)"
            labelPlacement="stacked"
            type="text"
            placeholder="Ex: Penser à trier les chaussettes"
            formControlName="note"
          ></ion-input>
        </ion-item>

        <ion-item lines="none" class="ion-margin-top">
          <ion-label>Réaliser la tâche avant le</ion-label>
          <ion-datetime-button datetime="expirationDatePicker"></ion-datetime-button>

          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime
                id="expirationDatePicker"
                formControlName="expirationDate"
                presentation="date-time"
                locale="fr-FR"
                [min]="minDate"
                [showDefaultButtons]="true"
                cancelText="Annuler"
                doneText="Valider"
              ></ion-datetime>
            </ng-template>
          </ion-modal>
        </ion-item>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
